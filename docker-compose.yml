services:
  expo:
    container_name: bassh-expo
    build:
      context: ./myApp
      dockerfile: Dockerfile
    volumes:
      - ./myApp:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - NODE_ENV=development
    env_file:
      - ./myApp/.env
    stdin_open: true
    tty: true

  web:
    container_name: bassh-web
    build:
      context: ./web
      dockerfile: Dockerfile
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - ./web/.env