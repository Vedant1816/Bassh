
services:
  expo:
    container_name: baash-expo
    build:
      context: ./app
    volumes:
      - ./app:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    stdin_open: true
    tty: true

  web:
    container_name: baash-web
    build:
      context: ./web
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "4000:4000"